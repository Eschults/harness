# .github/workflows/notion-roadmap-sync.yml
#
# Notion has no outbound webhooks for "card moved to column X" on the
# free/standard API, so this polls instead. Every 15 minutes it asks
# Notion for cards in the "Ready for Dev" status that haven't been synced
# yet, opens one GitHub issue per card labeled "agent-ready" + "from-notion"
# (skipping sentry-triage.yml entirely, since a human already decided this
# work should happen — that's what moving the card to "Ready for Dev" means),
# and writes the issue link back onto the Notion card.
#
# Adjust the cron to your team's cadence. Every 15 min is a reasonable
# default; tighten it if you want near-real-time, loosen it to cut Actions
# minutes.

name: Notion Roadmap Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Versions come from scripts/package.json rather than the command
      # line, so a major release cannot land unnoticed. Falls back to
      # `npm install` until a lockfile is committed.
      - name: Install dependencies
        run: npm ci || npm install
        working-directory: scripts

      - name: Sync Notion cards to GitHub issues
        working-directory: scripts
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          # IMPORTANT: must be a PAT or GitHub App token, not the default
          # GITHUB_TOKEN. GitHub does not fire downstream workflow triggers
          # (like the "issues: labeled" event below) for issues created or
          # labeled with the default GITHUB_TOKEN, to prevent recursive
          # workflow loops. Using secrets.GITHUB_TOKEN here would create
          # the issue but silently never invoke Claude.
          GITHUB_TOKEN: ${{ secrets.NOTION_SYNC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node notion-poll.mjs
