# .github/workflows/claude-issue-to-pr.yml
#
# Fires the implementation routine when an issue is labelled "agent-ready".
# Both entry points (Sentry errors and Notion roadmap cards) converge on
# that label, and it is applied by a triage step, never by Sentry or Notion
# directly. That gate is what keeps this from firing on cosmetic errors or
# half-written cards.
#
# No Claude runs on the runner. The work happens in a remote cloud session;
# this job only translates the issue event into an authenticated POST and
# records the session URL on the issue.
#
# Task:     .claude/prompts/issue-to-pr.md  (and the routine prompt to paste)
# Rules:    CLAUDE.md
# Setup:    README.md, "One-time setup"
# Reads:    vars.CLAUDE_ROUTINE_ID, secrets.CLAUDE_ROUTINE_TOKEN

name: Claude — Issue to PR

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Sparse checkout: the cloud session clones the repo itself, so the
      # runner only needs the composite action.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions

      - name: Fire the implementation routine
        id: fire
        uses: ./.github/actions/fire-claude-routine
        with:
          routine-id: ${{ vars.CLAUDE_ROUTINE_ID }}
          routine-token: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          text: |
            Repository: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}
            URL: ${{ github.event.issue.html_url }}

            --- issue body ---
            ${{ github.event.issue.body }}

      # The session outlives this job, so the issue is the only place a
      # human can reliably find the run. Comment on success and on failure;
      # a silently stalled "agent-ready" issue is the worst failure mode
      # this harness has.
      - name: Link the session on the issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SESSION_URL: ${{ steps.fire.outputs.session-url }}
        run: |
          body=$(printf '%s\n\n%s\n' \
            "Claude Code cloud session started: $SESSION_URL" \
            "It will open a draft PR here when it is done, or comment on this issue if it decides not to. Open the session to watch, steer, or answer questions mid-run.")
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Report dispatch failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '%s\n\n%s\n' \
            "Failed to start a Claude Code cloud session for this issue. No agent is working on it. Details: $RUN_URL" \
            "Remove and re-apply the \`agent-ready\` label to retry.")
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
