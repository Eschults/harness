# .github/workflows/sentry-triage.yml
#
# The triage gate in front of the implementation step. Fires a cheap,
# read-only routine that labels a Sentry-authored issue "agent-ready" or
# "needs-human". Only the first of those triggers claude-issue-to-pr.yml.
#
# Triage is asynchronous: this job finishes in seconds and the verdict
# lands minutes later as a label. Nothing downstream breaks, because the
# chain was always "label applied -> next workflow", never "job output ->
# next job".
#
# The triage routine labels issues through your GitHub connector, which is
# your own identity rather than the default GITHUB_TOKEN, so the label it
# applies does fire the downstream issues.labeled event. See the comment in
# notion-roadmap-sync.yml for what breaks when that distinction is missed.
#
# Cloud sessions have no --allowedTools, so "read-only" is enforced by the
# routine's prompt and by attaching only the GitHub connector to it — not
# by this workflow.
#
# Task:     .claude/prompts/sentry-triage.md  (and the routine prompt to paste)
# Rules:    CLAUDE.md
# Setup:    README.md, "One-time setup" — including the Sentry alert rule,
#           whose trigger must be "A new issue is created"
# Reads:    vars.CLAUDE_TRIAGE_ROUTINE_ID, secrets.CLAUDE_TRIAGE_ROUTINE_TOKEN

name: Sentry Issue Triage

on:
  issues:
    types: [opened]

concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: contains(github.event.issue.labels.*.name, 'sentry')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Sparse checkout: the cloud session clones the repo itself, so the
      # runner only needs the composite action.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions

      - name: Fire the triage routine
        id: fire
        uses: ./.github/actions/fire-claude-routine
        with:
          routine-id: ${{ vars.CLAUDE_TRIAGE_ROUTINE_ID }}
          routine-token: ${{ secrets.CLAUDE_TRIAGE_ROUTINE_TOKEN }}
          text: |
            Repository: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}
            URL: ${{ github.event.issue.html_url }}

            --- issue body ---
            ${{ github.event.issue.body }}

      # A failed dispatch leaves an untriaged "sentry" issue that nothing
      # will ever pick up, so say so on the issue rather than only in the
      # Actions log.
      - name: Report dispatch failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '%s\n\n%s\n' \
            "Failed to start the Claude Code triage session for this issue. It has not been triaged and nothing downstream will pick it up. Details: $RUN_URL" \
            "Triage it by hand, or close and reopen the issue to retry.")
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-human
