<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 942" width="450" height="942" role="img" aria-label="Optionally, the Next to build routine wakes on a schedule, works out what the repo should gain next and files one issue. A human, a bot, or that routine labels an issue claude; a GitHub Actions workflow POSTs /fire; the Issue to PR routine in the cloud reads the issue, writes code, runs the tests, opens a PR, self-reviews it and removes the label. The human reviews the PR: if nothing needs to change they merge and deploy, otherwise they take control of the Claude session.">
<defs><marker id="d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="20" y="20" width="270" height="104" rx="10" fill="rgba(232,149,111,0.09)" stroke="#e8956f" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="32" y="40" font-size="9" font-weight="600" letter-spacing="1" fill="#f6cdb9">CLAUDE</text>
<text x="278" y="40" font-size="11" text-anchor="end" fill="#f6cdb9">Optional "Next to build" routine</text>
<rect x="35" y="56" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="155" y="76" font-size="13" text-anchor="middle" fill="#f6cdb9">Wakes on a schedule, works out</text>
<text x="155" y="94" font-size="13" text-anchor="middle" fill="#f6cdb9">what the repo should gain next</text>
<line x1="155" y1="124" x2="155" y2="144" stroke="#8b949e" stroke-width="1.25"/>
<text x="155" y="156" font-size="12" text-anchor="middle" fill="#767c85">Files one issue</text>
<line x1="155" y1="164" x2="155" y2="180" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="180" width="270" height="58" rx="6" fill="#2e1065" stroke="#a78bfa" stroke-width="1.25"/>
<text x="32" y="196" font-size="9" font-weight="600" letter-spacing="1" fill="#ddd6fe">YOU, BOT OR ROUTINE</text>
<text x="155" y="214" font-size="13" text-anchor="middle" fill="#ddd6fe">Label an issue <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan></text>
<line x1="155" y1="238" x2="155" y2="278" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="278" width="270" height="74" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1.25"/>
<text x="32" y="294" font-size="9" font-weight="600" letter-spacing="1" fill="#8b949e">GITHUB ACTIONS</text>
<text x="155" y="316" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">.github/workflows/claude.yml</text>
<text x="155" y="334" font-size="13" text-anchor="middle" fill="#8b949e">The only thing on your runner</text>
<line x1="155" y1="352" x2="155" y2="372" stroke="#8b949e" stroke-width="1.25"/>
<text x="155" y="384" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#767c85">POST /fire</text>
<line x1="155" y1="392" x2="155" y2="408" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="408" width="270" height="314" rx="10" fill="rgba(232,149,111,0.09)" stroke="#e8956f" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="32" y="428" font-size="9" font-weight="600" letter-spacing="1" fill="#f6cdb9">CLAUDE</text>
<text x="278" y="428" font-size="11" text-anchor="end" fill="#f6cdb9">"Issue to PR" routine, in the cloud</text>
<rect x="35" y="444" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="155" y="464" font-size="13" text-anchor="middle" fill="#f6cdb9">Reads the issue, writes code,</text>
<text x="155" y="482" font-size="13" text-anchor="middle" fill="#f6cdb9">runs the tests</text>
<line x1="155" y1="496" x2="155" y2="524" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="35" y="524" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="155" y="544" font-size="13" text-anchor="middle" fill="#f6cdb9">Opens a PR,</text>
<text x="155" y="562" font-size="13" text-anchor="middle" fill="#f6cdb9">comments the link on the issue</text>
<line x1="155" y1="576" x2="155" y2="604" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="35" y="604" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="155" y="624" font-size="13" text-anchor="middle" fill="#f6cdb9">Self-reviews the diff,</text>
<text x="155" y="642" font-size="13" text-anchor="middle" fill="#f6cdb9">fixes, recaps on the PR</text>
<line x1="155" y1="656" x2="155" y2="696" stroke="#8b949e" stroke-width="1.25"/>
<text x="155" y="710" font-size="12" text-anchor="middle" fill="#767c85">Removes the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<line x1="155" y1="722" x2="155" y2="740" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="740" width="270" height="58" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.25"/>
<text x="32" y="756" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="155" y="774" font-size="13" text-anchor="middle" fill="#bfdbfe">Review the PR</text>
<line x1="155" y1="798" x2="155" y2="820" stroke="#8b949e" stroke-width="1.25"/>
<text x="155" y="834" font-size="12" text-anchor="middle" fill="#767c85">Nothing to change</text>
<line x1="155" y1="842" x2="155" y2="864" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="864" width="270" height="58" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.25"/>
<text x="32" y="880" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="155" y="898" font-size="13" text-anchor="middle" fill="#bfdbfe">Merge and deploy</text>
<path d="M291,769 H330 V565 H296" fill="none" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="4 3" stroke-linejoin="round" marker-end="url(#d-arrow)"/>
<text x="340" y="655" font-size="12" fill="#767c85">Take control of</text>
<text x="340" y="671" font-size="12" fill="#767c85">Claude session</text>
<text x="340" y="687" font-size="12" fill="#767c85">if needed</text>
</g>
</svg>
