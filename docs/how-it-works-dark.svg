<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 800" width="580" height="800" role="img" aria-label="Optionally, the Next to Build routine wakes on a schedule, works out what the repo needs next and files one issue. A human, a bot, or that routine labels an issue claude; a GitHub Actions workflow POSTs /fire; the Issue to PR routine reads the issue, writes code, runs the tests, opens a PR, self-reviews it and removes the label. The human reviews the PR: if nothing needs to change they merge and deploy, otherwise they take control of the Claude session.">
<defs><marker id="d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="20" y="20" width="230" height="92" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="32" y="36" font-size="9" font-weight="600" letter-spacing="1" fill="#f6cdb9">CLAUDE, ON A SCHEDULE</text>
<text x="135" y="58" font-size="13" text-anchor="middle" fill="#f6cdb9">Optional "Next to Build"</text>
<text x="135" y="76" font-size="13" text-anchor="middle" fill="#f6cdb9">works out what the repo</text>
<text x="135" y="94" font-size="13" text-anchor="middle" fill="#f6cdb9">needs next, files one issue</text>
<line x1="250" y1="66" x2="290" y2="66" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="37" width="270" height="58" rx="6" fill="#2e1065" stroke="#a78bfa" stroke-width="1.25"/>
<text x="302" y="53" font-size="9" font-weight="600" letter-spacing="1" fill="#ddd6fe">YOU, BOT OR ROUTINE</text>
<text x="425" y="71" font-size="13" text-anchor="middle" fill="#ddd6fe">Label an issue <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan></text>
<line x1="425" y1="95" x2="425" y2="135" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="135" width="270" height="74" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1.25"/>
<text x="302" y="151" font-size="9" font-weight="600" letter-spacing="1" fill="#8b949e">GITHUB ACTIONS</text>
<text x="425" y="173" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">.github/workflows/claude.yml</text>
<text x="425" y="191" font-size="13" text-anchor="middle" fill="#8b949e">The only thing on your runner</text>
<line x1="425" y1="209" x2="425" y2="229" stroke="#8b949e" stroke-width="1.25"/>
<text x="425" y="241" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#767c85">POST /fire</text>
<line x1="425" y1="249" x2="425" y2="265" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="265" width="270" height="314" rx="10" fill="rgba(232,149,111,0.09)" stroke="#e8956f" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="302" y="285" font-size="9" font-weight="600" letter-spacing="1" fill="#f6cdb9">CLAUDE</text>
<text x="548" y="285" font-size="11" text-anchor="end" fill="#f6cdb9">"Issue to PR" routine</text>
<rect x="305" y="301" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="425" y="321" font-size="13" text-anchor="middle" fill="#f6cdb9">Reads the issue, writes code,</text>
<text x="425" y="339" font-size="13" text-anchor="middle" fill="#f6cdb9">runs the tests</text>
<line x1="425" y1="353" x2="425" y2="381" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="305" y="381" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="425" y="401" font-size="13" text-anchor="middle" fill="#f6cdb9">Opens a PR,</text>
<text x="425" y="419" font-size="13" text-anchor="middle" fill="#f6cdb9">comments the link on the issue</text>
<line x1="425" y1="433" x2="425" y2="461" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="305" y="461" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="425" y="481" font-size="13" text-anchor="middle" fill="#f6cdb9">Self-reviews the diff,</text>
<text x="425" y="499" font-size="13" text-anchor="middle" fill="#f6cdb9">fixes, recaps on the PR</text>
<line x1="425" y1="513" x2="425" y2="553" stroke="#8b949e" stroke-width="1.25"/>
<text x="425" y="567" font-size="12" text-anchor="middle" fill="#767c85">Removes the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<line x1="425" y1="579" x2="425" y2="597" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="597" width="270" height="58" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.25"/>
<text x="302" y="613" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="425" y="631" font-size="13" text-anchor="middle" fill="#bfdbfe">Review the PR</text>
<line x1="425" y1="655" x2="425" y2="677" stroke="#8b949e" stroke-width="1.25"/>
<text x="425" y="691" font-size="12" text-anchor="middle" fill="#767c85">Nothing to change</text>
<line x1="425" y1="699" x2="425" y2="721" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="721" width="270" height="58" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.25"/>
<text x="302" y="737" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="425" y="755" font-size="13" text-anchor="middle" fill="#bfdbfe">Merge and deploy</text>
<path d="M289,626 H255 V422 H284" fill="none" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="4 3" stroke-linejoin="round" marker-end="url(#d-arrow)"/>
<text x="243" y="505" font-size="12" text-anchor="end" fill="#767c85">Take control of</text>
<text x="243" y="521" font-size="12" text-anchor="end" fill="#767c85">Claude session</text>
<text x="243" y="537" font-size="12" text-anchor="end" fill="#767c85">if needed</text>
</g>
</svg>
