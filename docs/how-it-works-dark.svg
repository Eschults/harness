<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 782" width="580" height="782" role="img" aria-label="Optionally, the Next to Build routine works out what to build next on a schedule and files an issue with the claude label. An issue labeled claude is the trigger, whether a human, a bot or that routine applies it; a GitHub Actions workflow POSTs /fire; the Issue to PR routine reads the issue, writes code, runs the tests, opens a PR, self-reviews it and removes the label. The human reviews the PR: if nothing needs to change they merge and deploy, otherwise they take control of the Claude session.">
<defs><marker id="d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="20" y="248" width="250" height="104" rx="10" fill="rgba(232,149,111,0.09)" stroke="#e8956f" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="32" y="268" font-size="9" font-weight="600" letter-spacing="1" fill="#f6cdb9">CLAUDE</text>
<text x="258" y="268" font-size="11" text-anchor="end" fill="#f6cdb9">Optional "Next to Build" routine</text>
<rect x="35" y="284" width="220" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="145" y="304" font-size="13" text-anchor="middle" fill="#f6cdb9">Works out what to build next</text>
<text x="145" y="322" font-size="13" text-anchor="middle" fill="#f6cdb9">on a schedule</text>
<line x1="145" y1="248" x2="145" y2="228" stroke="#8b949e" stroke-width="1.25"/>
<text x="145" y="222" font-size="12" text-anchor="middle" fill="#767c85">Files an issue with the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<path d="M145,208 V49 H286" fill="none" stroke="#8b949e" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#d-arrow)"/>
<rect x="290" y="20" width="270" height="58" rx="6" fill="#4b7fd0" stroke="#7aa7e6" stroke-width="2"/>
<text x="425" y="54" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Issue labeled <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">claude</tspan></text>
<line x1="425" y1="78" x2="425" y2="118" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="118" width="270" height="74" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1.25"/>
<text x="302" y="134" font-size="9" font-weight="600" letter-spacing="1" fill="#8b949e">GITHUB ACTIONS</text>
<text x="425" y="156" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">.github/workflows/claude.yml</text>
<text x="425" y="174" font-size="13" text-anchor="middle" fill="#8b949e">The only thing on your runner</text>
<line x1="425" y1="192" x2="425" y2="212" stroke="#8b949e" stroke-width="1.25"/>
<text x="425" y="224" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#767c85">POST /fire</text>
<line x1="425" y1="232" x2="425" y2="248" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="248" width="270" height="314" rx="10" fill="rgba(232,149,111,0.09)" stroke="#e8956f" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="302" y="268" font-size="9" font-weight="600" letter-spacing="1" fill="#f6cdb9">CLAUDE</text>
<text x="548" y="268" font-size="11" text-anchor="end" fill="#f6cdb9">"Issue to PR" routine</text>
<rect x="305" y="284" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="425" y="304" font-size="13" text-anchor="middle" fill="#f6cdb9">Reads the issue, writes code,</text>
<text x="425" y="322" font-size="13" text-anchor="middle" fill="#f6cdb9">runs the tests</text>
<line x1="425" y1="336" x2="425" y2="364" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="305" y="364" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="425" y="384" font-size="13" text-anchor="middle" fill="#f6cdb9">Opens a PR,</text>
<text x="425" y="402" font-size="13" text-anchor="middle" fill="#f6cdb9">comments the link on the issue</text>
<line x1="425" y1="416" x2="425" y2="444" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="305" y="444" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="425" y="464" font-size="13" text-anchor="middle" fill="#f6cdb9">Self-reviews the diff,</text>
<text x="425" y="482" font-size="13" text-anchor="middle" fill="#f6cdb9">fixes, recaps on the PR</text>
<line x1="425" y1="496" x2="425" y2="536" stroke="#8b949e" stroke-width="1.25"/>
<text x="425" y="550" font-size="12" text-anchor="middle" fill="#767c85">Removes the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<line x1="425" y1="562" x2="425" y2="580" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="580" width="270" height="58" rx="6" fill="#131f3d" stroke="#4b7fd0" stroke-width="1.25"/>
<text x="302" y="596" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="425" y="614" font-size="13" text-anchor="middle" fill="#bfdbfe">Review the PR</text>
<line x1="425" y1="638" x2="425" y2="660" stroke="#8b949e" stroke-width="1.25"/>
<text x="425" y="674" font-size="12" text-anchor="middle" fill="#767c85">Nothing to change</text>
<line x1="425" y1="682" x2="425" y2="704" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="290" y="704" width="270" height="58" rx="6" fill="#131f3d" stroke="#4b7fd0" stroke-width="1.25"/>
<text x="302" y="720" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="425" y="738" font-size="13" text-anchor="middle" fill="#bfdbfe">Merge and deploy</text>
<path d="M289,609 H255 V405 H284" fill="none" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="4 3" stroke-linejoin="round" marker-end="url(#d-arrow)"/>
<text x="243" y="488" font-size="12" text-anchor="end" fill="#767c85">Take control of</text>
<text x="243" y="504" font-size="12" text-anchor="end" fill="#767c85">Claude session</text>
<text x="243" y="520" font-size="12" text-anchor="end" fill="#767c85">if needed</text>
</g>
</svg>
