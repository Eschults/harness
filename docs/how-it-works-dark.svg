<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 782" width="450" height="782" role="img" aria-label="A human labels an issue claude; a GitHub Actions workflow POSTs /fire; one Claude routine in the cloud reads the issue, writes code, runs the tests, opens a PR, self-reviews it and removes the label. The human reviews the PR: if nothing needs to change they merge and deploy, otherwise they take control of the Claude session.">
<defs><marker id="d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="20" y="20" width="270" height="58" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.25"/>
<text x="32" y="36" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="155" y="54" font-size="13" text-anchor="middle" fill="#bfdbfe">Label an issue <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan></text>
<line x1="155" y1="78" x2="155" y2="118" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="118" width="270" height="74" rx="6" fill="#161b22" stroke="#484f58" stroke-width="1.25"/>
<text x="32" y="134" font-size="9" font-weight="600" letter-spacing="1" fill="#8b949e">GITHUB ACTIONS</text>
<text x="155" y="156" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">.github/workflows/claude.yml</text>
<text x="155" y="174" font-size="13" text-anchor="middle" fill="#8b949e">The only thing on your runner</text>
<line x1="155" y1="192" x2="155" y2="212" stroke="#8b949e" stroke-width="1.25"/>
<text x="155" y="224" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">POST /fire</text>
<line x1="155" y1="232" x2="155" y2="248" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="248" width="270" height="264" rx="10" fill="rgba(232,149,111,0.09)" stroke="#e8956f" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="32" y="268" font-size="9" font-weight="600" letter-spacing="1" fill="#f6cdb9">CLAUDE</text>
<text x="278" y="268" font-size="11" text-anchor="end" fill="#f6cdb9">One routine, in the cloud</text>
<rect x="35" y="284" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="155" y="304" font-size="13" text-anchor="middle" fill="#f6cdb9">Reads the issue, writes code,</text>
<text x="155" y="322" font-size="13" text-anchor="middle" fill="#f6cdb9">runs the tests</text>
<line x1="155" y1="336" x2="155" y2="364" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="35" y="364" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="155" y="384" font-size="13" text-anchor="middle" fill="#f6cdb9">Opens a PR,</text>
<text x="155" y="402" font-size="13" text-anchor="middle" fill="#f6cdb9">comments the link on the issue</text>
<line x1="155" y1="416" x2="155" y2="444" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="35" y="444" width="240" height="52" rx="6" fill="#3a1f14" stroke="#e8956f" stroke-width="1.25"/>
<text x="155" y="464" font-size="13" text-anchor="middle" fill="#f6cdb9">Self-reviews the diff,</text>
<text x="155" y="482" font-size="13" text-anchor="middle" fill="#f6cdb9">fixes, recaps on the PR</text>
<line x1="155" y1="512" x2="155" y2="536" stroke="#8b949e" stroke-width="1.25"/>
<text x="155" y="550" font-size="12" text-anchor="middle" fill="#e6edf3">Removes the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<line x1="155" y1="558" x2="155" y2="580" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="580" width="270" height="58" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.25"/>
<text x="32" y="596" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="155" y="614" font-size="13" text-anchor="middle" fill="#bfdbfe">Review the PR</text>
<line x1="155" y1="638" x2="155" y2="660" stroke="#8b949e" stroke-width="1.25"/>
<text x="155" y="674" font-size="12" text-anchor="middle" fill="#e6edf3">Nothing to change</text>
<line x1="155" y1="682" x2="155" y2="704" stroke="#8b949e" stroke-width="1.25" marker-end="url(#d-arrow)"/>
<rect x="20" y="704" width="270" height="58" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.25"/>
<text x="32" y="720" font-size="9" font-weight="600" letter-spacing="1" fill="#bfdbfe">YOU</text>
<text x="155" y="738" font-size="13" text-anchor="middle" fill="#bfdbfe">Merge and deploy</text>
<path d="M291,609 H330 V380 H296" fill="none" stroke="#8b949e" stroke-width="1.25" stroke-dasharray="4 3" stroke-linejoin="round" marker-end="url(#d-arrow)"/>
<text x="340" y="483" font-size="12" fill="#bfdbfe">Take control of</text>
<text x="340" y="499" font-size="12" fill="#bfdbfe">Claude session</text>
<text x="340" y="515" font-size="12" fill="#bfdbfe">if needed</text>
</g>
</svg>
