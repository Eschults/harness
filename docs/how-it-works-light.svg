<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 774" width="580" height="774" role="img" aria-label="Optionally, the Next to Build routine works out what to build next on a schedule and files an issue with the claude label. An issue labeled claude is the trigger, whether a human, a bot or that routine applies it; a GitHub Actions workflow POSTs /fire; the Issue to PR routine reads the issue, writes code, runs the tests, opens a PR, self-reviews it and removes the label. The human reviews the PR: if nothing needs to change they merge and deploy, otherwise they take control of the Claude session.">
<defs><marker id="l-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="20" y="239" width="250" height="104" rx="10" fill="rgba(217,119,87,0.07)" stroke="#d97757" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="32" y="259" font-size="9" font-weight="600" letter-spacing="1" fill="#7a3418">CLAUDE</text>
<text x="258" y="259" font-size="11" text-anchor="end" fill="#7a3418">Optional "Next to Build" routine</text>
<rect x="35" y="275" width="220" height="52" rx="6" fill="#fbe9e1" stroke="#d97757" stroke-width="1.25"/>
<text x="145" y="295" font-size="13" text-anchor="middle" fill="#7a3418">Works out what to build next</text>
<text x="145" y="313" font-size="13" text-anchor="middle" fill="#7a3418">on a schedule</text>
<line x1="145" y1="239" x2="145" y2="219" stroke="#6e7781" stroke-width="1.25"/>
<text x="145" y="213" font-size="12" text-anchor="middle" fill="#767c85">Files an issue with the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<path d="M145,199 V42 H301" fill="none" stroke="#6e7781" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#l-arrow)"/>
<rect x="305" y="20" width="240" height="44" rx="22" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.25"/>
<text x="425" y="47" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Issue labeled <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">claude</tspan></text>
<line x1="425" y1="64" x2="425" y2="109" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="290" y="109" width="270" height="74" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="302" y="125" font-size="9" font-weight="600" letter-spacing="1" fill="#656d76">GITHUB ACTIONS</text>
<text x="425" y="147" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">.github/workflows/claude.yml</text>
<text x="425" y="165" font-size="13" text-anchor="middle" fill="#656d76">The only thing on your runner</text>
<line x1="425" y1="183" x2="425" y2="203" stroke="#6e7781" stroke-width="1.25"/>
<text x="425" y="215" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#767c85">POST /fire</text>
<line x1="425" y1="223" x2="425" y2="239" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="290" y="239" width="270" height="314" rx="10" fill="rgba(217,119,87,0.07)" stroke="#d97757" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="302" y="259" font-size="9" font-weight="600" letter-spacing="1" fill="#7a3418">CLAUDE</text>
<text x="548" y="259" font-size="11" text-anchor="end" fill="#7a3418">"Issue to PR" routine</text>
<rect x="305" y="275" width="240" height="52" rx="6" fill="#fbe9e1" stroke="#d97757" stroke-width="1.25"/>
<text x="425" y="295" font-size="13" text-anchor="middle" fill="#7a3418">Reads the issue, writes code,</text>
<text x="425" y="313" font-size="13" text-anchor="middle" fill="#7a3418">runs the tests</text>
<line x1="425" y1="327" x2="425" y2="355" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="305" y="355" width="240" height="52" rx="6" fill="#fbe9e1" stroke="#d97757" stroke-width="1.25"/>
<text x="425" y="375" font-size="13" text-anchor="middle" fill="#7a3418">Opens a PR,</text>
<text x="425" y="393" font-size="13" text-anchor="middle" fill="#7a3418">comments the link on the issue</text>
<line x1="425" y1="407" x2="425" y2="435" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="305" y="435" width="240" height="52" rx="6" fill="#fbe9e1" stroke="#d97757" stroke-width="1.25"/>
<text x="425" y="455" font-size="13" text-anchor="middle" fill="#7a3418">Self-reviews the diff,</text>
<text x="425" y="473" font-size="13" text-anchor="middle" fill="#7a3418">fixes, recaps on the PR</text>
<line x1="425" y1="487" x2="425" y2="527" stroke="#6e7781" stroke-width="1.25"/>
<text x="425" y="541" font-size="12" text-anchor="middle" fill="#767c85">Removes the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<line x1="425" y1="553" x2="425" y2="571" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="290" y="571" width="270" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.25"/>
<text x="302" y="587" font-size="9" font-weight="600" letter-spacing="1" fill="#1e3a8a">YOU</text>
<text x="425" y="605" font-size="13" text-anchor="middle" fill="#1e3a8a">Review the PR</text>
<line x1="425" y1="629" x2="425" y2="651" stroke="#6e7781" stroke-width="1.25"/>
<text x="425" y="665" font-size="12" text-anchor="middle" fill="#767c85">Nothing to change</text>
<line x1="425" y1="673" x2="425" y2="695" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="290" y="695" width="270" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.25"/>
<text x="302" y="711" font-size="9" font-weight="600" letter-spacing="1" fill="#1e3a8a">YOU</text>
<text x="425" y="729" font-size="13" text-anchor="middle" fill="#1e3a8a">Merge and deploy</text>
<path d="M289,600 H255 V396 H284" fill="none" stroke="#6e7781" stroke-width="1.25" stroke-dasharray="4 3" stroke-linejoin="round" marker-end="url(#l-arrow)"/>
<text x="243" y="479" font-size="12" text-anchor="end" fill="#767c85">Take control of</text>
<text x="243" y="495" font-size="12" text-anchor="end" fill="#767c85">Claude session</text>
<text x="243" y="511" font-size="12" text-anchor="end" fill="#767c85">if needed</text>
</g>
</svg>
