<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 830" width="580" height="830" role="img" aria-label="An issue labeled claude is the trigger. You file it, your APM files it on an error, your project management tool files it from its roadmap, or optionally the Next to Build routine, which works out what to build next on a schedule, files it. A GitHub Actions workflow POSTs /fire; the Issue to PR routine reads the issue, writes code, runs the tests, opens a PR, self-reviews it and removes the label. The human reviews the PR: if nothing needs to change they merge and deploy, otherwise they take control of the Claude session.">
<defs><marker id="l-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs>
<g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="425" y="30" font-size="12" text-anchor="middle" fill="#767c85">You, your APM’s errors, your PM tool’s roadmap, …</text>
<line x1="371" y1="38" x2="371" y2="68" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<line x1="425" y1="38" x2="425" y2="68" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<line x1="479" y1="38" x2="479" y2="68" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="20" y="296" width="250" height="104" rx="10" fill="rgba(217,119,87,0.07)" stroke="#d97757" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="32" y="316" font-size="9" font-weight="600" letter-spacing="1" fill="#7a3418">CLAUDE</text>
<text x="258" y="316" font-size="11" text-anchor="end" fill="#7a3418">Optional "Next to Build" routine</text>
<rect x="35" y="332" width="220" height="52" rx="6" fill="#fbe9e1" stroke="#d97757" stroke-width="1.25"/>
<text x="145" y="352" font-size="13" text-anchor="middle" fill="#7a3418">Works out what to build next</text>
<text x="145" y="370" font-size="13" text-anchor="middle" fill="#7a3418">on a schedule</text>
<line x1="145" y1="296" x2="145" y2="276" stroke="#6e7781" stroke-width="1.25"/>
<text x="145" y="270" font-size="12" text-anchor="middle" fill="#767c85">Files an issue with the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<path d="M145,256 V97 H286" fill="none" stroke="#6e7781" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#l-arrow)"/>
<rect x="290" y="68" width="270" height="58" rx="6" fill="#6cacf9" stroke="#6cacf9" stroke-width="2"/>
<text x="425" y="102" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Issue labeled <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">claude</tspan></text>
<line x1="425" y1="126" x2="425" y2="166" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="290" y="166" width="270" height="74" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="302" y="182" font-size="9" font-weight="600" letter-spacing="1" fill="#656d76">GITHUB ACTIONS</text>
<text x="425" y="204" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f2328">.github/workflows/claude.yml</text>
<text x="425" y="222" font-size="13" text-anchor="middle" fill="#656d76">The only thing on your runner</text>
<line x1="425" y1="240" x2="425" y2="260" stroke="#6e7781" stroke-width="1.25"/>
<text x="425" y="272" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#767c85">POST /fire</text>
<line x1="425" y1="280" x2="425" y2="296" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="290" y="296" width="270" height="314" rx="10" fill="rgba(217,119,87,0.07)" stroke="#d97757" stroke-width="1.25" stroke-dasharray="4 3"/>
<text x="302" y="316" font-size="9" font-weight="600" letter-spacing="1" fill="#7a3418">CLAUDE</text>
<text x="548" y="316" font-size="11" text-anchor="end" fill="#7a3418">"Issue to PR" routine</text>
<rect x="305" y="332" width="240" height="52" rx="6" fill="#fbe9e1" stroke="#d97757" stroke-width="1.25"/>
<text x="425" y="352" font-size="13" text-anchor="middle" fill="#7a3418">Reads the issue, writes code,</text>
<text x="425" y="370" font-size="13" text-anchor="middle" fill="#7a3418">runs the tests</text>
<line x1="425" y1="384" x2="425" y2="412" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="305" y="412" width="240" height="52" rx="6" fill="#fbe9e1" stroke="#d97757" stroke-width="1.25"/>
<text x="425" y="432" font-size="13" text-anchor="middle" fill="#7a3418">Opens a PR,</text>
<text x="425" y="450" font-size="13" text-anchor="middle" fill="#7a3418">comments the link on the issue</text>
<line x1="425" y1="464" x2="425" y2="492" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="305" y="492" width="240" height="52" rx="6" fill="#fbe9e1" stroke="#d97757" stroke-width="1.25"/>
<text x="425" y="512" font-size="13" text-anchor="middle" fill="#7a3418">Self-reviews the diff,</text>
<text x="425" y="530" font-size="13" text-anchor="middle" fill="#7a3418">fixes, recaps on the PR</text>
<line x1="425" y1="544" x2="425" y2="584" stroke="#6e7781" stroke-width="1.25"/>
<text x="425" y="598" font-size="12" text-anchor="middle" fill="#767c85">Removes the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">claude</tspan> label</text>
<line x1="425" y1="610" x2="425" y2="628" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="290" y="628" width="270" height="58" rx="6" fill="#eaf2fd" stroke="#5087d8" stroke-width="1.25"/>
<text x="302" y="644" font-size="9" font-weight="600" letter-spacing="1" fill="#1e3a8a">YOU</text>
<text x="425" y="662" font-size="13" text-anchor="middle" fill="#1e3a8a">Review the PR</text>
<line x1="425" y1="686" x2="425" y2="708" stroke="#6e7781" stroke-width="1.25"/>
<text x="425" y="722" font-size="12" text-anchor="middle" fill="#767c85">Nothing to change</text>
<line x1="425" y1="730" x2="425" y2="752" stroke="#6e7781" stroke-width="1.25" marker-end="url(#l-arrow)"/>
<rect x="290" y="752" width="270" height="58" rx="6" fill="#eaf2fd" stroke="#5087d8" stroke-width="1.25"/>
<text x="302" y="768" font-size="9" font-weight="600" letter-spacing="1" fill="#1e3a8a">YOU</text>
<text x="425" y="786" font-size="13" text-anchor="middle" fill="#1e3a8a">Merge and deploy</text>
<path d="M289,657 H255 V453 H284" fill="none" stroke="#6e7781" stroke-width="1.25" stroke-dasharray="4 3" stroke-linejoin="round" marker-end="url(#l-arrow)"/>
<text x="243" y="536" font-size="12" text-anchor="end" fill="#767c85">Take control of</text>
<text x="243" y="552" font-size="12" text-anchor="end" fill="#767c85">Claude session</text>
<text x="243" y="568" font-size="12" text-anchor="end" fill="#767c85">if needed</text>
</g>
</svg>
